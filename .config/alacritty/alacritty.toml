[general]
import = [ "./colors.toml" ]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
position = "None"
padding = { x = 5, y = 5 }
dynamic_padding = true
decorations = "None"
dimensions = { columns = 90, lines = 25 }
opacity = 0.92
blur = true

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 1 }

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off"}
unfocused_hollow = true
thickness = 0.15

[terminal]
# shell = { program = "/bin/bash", args = ["-l"] }
# shell = { program = "/bin/tmux"}
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = true

[[hints.enabled]]
command = "xdg-open"                # macOS 用 open，Linux 用 xdg-open
hyperlinks = true
post_processing = true
persist = false
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh://|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
binding = { key = "U", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Control" }

[keyboard]
bindings = [
    { key = "C", mods = "Super", action = "Copy" },
    { key = "V", mods = "Super", action = "Paste" },
    { key = "F", mods = "Super", action = "SearchForward" },
    { key = "N", mods = "Super", action = "CreateNewWindow" },
    { key = "Minus", mods = "Super", action = "DecreaseFontSize" },
    { key = "Equals", mods = "Super", action = "IncreaseFontSize" },
    { key = "Return", mods = "Super", action = "ToggleSimpleFullscreen" },
    { key = "H", mods = "Super", action = "Hide" },
    { key = "Key0", mods = "Super", action = "ResetFontSize" },
    { key = "Key1", mods = "Super", action = "SelectTab1" },
    { key = "Key2", mods = "Super", action = "SelectTab2" },
    { key = "Key3", mods = "Super", action = "SelectTab3" },
    { key = "Key4", mods = "Super", action = "SelectTab4" },
    { key = "Key5", mods = "Super", action = "SelectTab5" },
    { key = "Key6", mods = "Super", action = "SelectTab6" },
    { key = "Key7", mods = "Super", action = "SelectTab7" },
    { key = "Key8", mods = "Super", action = "SelectTab8" },
    { key = "Key9", mods = "Super", action = "SelectTab9" },
]

