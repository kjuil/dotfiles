# ========== 鼠标操作 ==========
MBTN_LEFT       ignore              # 禁用左键
MBTN_LEFT_DBL   cycle fullscreen    # 双击左键：全屏
MBTN_RIGHT      cycle pause         # 右键单击：暂停/播放
MBTN_FORWARD    playlist-prev       # 前侧键：播放上一个视频
MBTN_BACK       playlist-next       # 后侧键：播放下一个视频
WHEEL_UP        add volume 5        # 滚轮上：音量+5
WHEEL_DOWN      add volume -5       # 滚轮下：音量-5

# ========== 方向键导航 ==========
RIGHT       seek 5                  # 右键：快进5秒
LEFT        seek -5                 # 左键：快退5秒
UP          add volume 5            # 上键：音量+5
DOWN        add volume -5           # 下键：音量-5
Shift+RIGHT seek 60                 # Shift+右键：快进60秒
Shift+LEFT  seek -60                # Shift+左键：快退60秒
Ctrl+RIGHT  sub-seek 1              # Ctrl+右键：跳到下一个字幕
Ctrl+LEFT   sub-seek -1             # Ctrl+左键：跳到上一个字幕

# ========== 播放控制 ==========
[       multiply speed 1/1.1        # [ 键：速度-10%
]       multiply speed 1.1          # ] 键：速度+10%
{       multiply speed 0.5          # { 键：速度减半
}       multiply speed 2.0          # } 键：速度加倍
BS      set speed 1.0               # 退格键：重置速度为1.0
SPACE   cycle pause                 # 空格键：播放暂停

# ========== 截图控制 ==========
s       screenshot                  # s键：含字幕截图
S       screenshot video            # Shift+s键：纯视频截图

# ========== 窗口控制 ==========
q       quit                        # q键：退出
Q       quit-watch-later            # Shift+q：退出并保留播放进度
f       cycle fullscreen            # f键：切换全屏
t       cycle ontop                 # t键：切换窗口置顶
ENTER   cycle fullscreen            # ENTER：切换全屏
ESC     set fullscreen no           # ESC: 退出全屏
o       show-progress               # o键：显示播放进度

ctrl+p  script-binding select/menu              # Ctrl+p：打开菜单
p       script-binding select/select-playlist   # p键: 打开播放列表
i       script-binding stats/display-stats      # i键：显示统计信息
TAB     script-binding modernz/visibility       # Tab键：切换OSC显示模式

# ========== 字幕控制 ==========
j       cycle sub                       # j键：切换主字幕轨道
J       cycle sub down                  # Shift+j：反向切换
k       cycle secondary-sid             # k键：切换次字幕轨道
K       cycle secondary-sid down        # Shift+k：反向切换
v       cycle sub-visibility            # v键：切换字幕显示
Shift+v cycle secondary-sub-visibility  # Shift+v：切换子字幕显示

# ========== 媒体快捷键 ==========
POWER       quit
PLAY        cycle pause
PAUSE       cycle pause
PLAYPAUSE   cycle pause
PLAYONLY    set pause no
PAUSEONLY   set pause yes
STOP        quit
FORWARD     seek 60
REWIND      seek -60
NEXT        playlist-next
PREV        playlist-prev
VOLUME_UP   add volume 2
VOLUME_DOWN add volume -2
MUTE cycle  mute

